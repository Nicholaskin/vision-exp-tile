# vision-exp-tile 自动发布工作流（GitHub Actions）
#
# 触发：推送 v* 标签（如 v0.1.3）→ 自动：
#   1) 安装依赖  2) 运行单元测试（npm test）  3) 打包 **两个** Release 资产 zip
#      - vision-exp-tile-v<版本>.zip        ：完整版（含 Python OCR 引擎支持，venv 可选）
#      - vision-exp-tile-v<版本>-nopython.zip：无 Python 零配置版（本地识别 = Windows OCR 常驻池；
#                                              剔除 src/ocr-worker.py）
#   4) 创建 GitHub Release 并附上两个 zip
#
# 使用：git tag v0.1.3 && git push origin v0.1.3   即可（或网页打 tag）
# 首次使用无需配置：仓库默认启用 Actions；GITHUB_TOKEN 自动提供。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release 必需

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

      - name: 打包 Release 资产（两个 zip：完整版 + 无 Python 零配置版）
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # 1) 完整版：全部源码（含 ocr-worker.py 常驻 Python 引擎支持）
          #    v0.5.0 起补入 std-facet.js / dsh-plugin.json（dsh-std 标准形态备用入口）与 CHANGELOG.md
          zip -r "dist/vision-exp-tile-v${VER}.zip" \
            src tests scripts client.js std-facet.js dsh-plugin.json cordis.patch.yml \
            package.json README.md CHANGELOG.md LICENSE .gitignore \
            -x '*/node_modules/*'
          # 2) 无 Python 零配置版：剔除 ocr-worker.py（本地识别自动降级为 Windows OCR 常驻池）
          zip -r "dist/vision-exp-tile-v${VER}-nopython.zip" \
            src tests scripts client.js std-facet.js dsh-plugin.json cordis.patch.yml \
            package.json README.md CHANGELOG.md LICENSE .gitignore \
            -x '*/node_modules/*' -x 'src/ocr-worker.py'
          echo "已生成："
          ls -lh dist/

      - name: 从 CHANGELOG.md 提取本次版本段（Release 栏 = 仅当次更新内容）
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # 提取 "## vX.Y.Z（" 段落（到下一个 "## v" 段落为止；标题含日期后缀需按前缀匹配）
          awk -v ver="## v${VER}（" '
            $0 ~ /^## v[0-9]/ && index($0, ver) == 1 { take = 1; next }
            $0 ~ /^## v[0-9]/ { take = 0 }
            take { print }
          ' CHANGELOG.md > notes.md
          echo "--- notes.md 标题 ---"; grep -m1 '^## ' notes.md || echo '(未找到对应段落，请检查 CHANGELOG.md 是否已更新！)'
          test -s notes.md || exit 1

      - name: 创建 GitHub Release 并附资产（changelog 栏 = 本次版本中文内容）
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/vision-exp-tile-v*.zip

